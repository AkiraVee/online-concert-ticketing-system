  <style>
    body { font-family: 'DM Sans', sans-serif; }
    .serif { font-family: 'DM Serif Display', serif; }

    .hero-blur {
      position: absolute; inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(28px) brightness(0.3);
      transform: scale(1.05);
    }

    .thumb { transition: all 0.2s; cursor: pointer; }
    .thumb:hover { opacity: 1 !important; }
    .thumb.active { outline: 2px solid #7c3aed; outline-offset: 2px; opacity: 1 !important; }

    .date-btn { transition: all 0.2s; }
    .date-btn.selected { background: #7c3aed; color: white; border-color: #7c3aed; }

    .tier-card { transition: all 0.2s; }
    .tier-card.selected { border-color: #7c3aed; background: rgba(124,58,237,0.08); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.4s ease forwards; }

    /* Modal */
    #buyModal { display: none; }
    #buyModal.open { display: flex; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-300 min-h-screen">

      </div>
      <div class="mb-6">
        <label class="block text-xs text-zinc-400 mb-1.5 font-medium uppercase tracking-wide">Payment Method</label>

      document.title = `${state.event.title} — Ticketo`;
      renderPage();

                <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4">
                  <p class="text-xs text-zinc-500 mb-1 uppercase tracking-wide">Duration</p>
                  <p class="text-white text-sm font-medium">${e.duration}</p>
                </div>
                <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4">
                  <p class="text-xs text-zinc-500 mb-1 uppercase tracking-wide">Type</p>
                  <p class="text-white text-sm font-medium">${e.type}</p>
                </div>
                <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4">
                  <p class="text-xs text-zinc-500 mb-1 uppercase tracking-wide">Available Shows</p>
                  <p class="text-white text-sm font-medium">${e.dates.length} date${e.dates.length > 1 ? 's' : ''}</p>
                </div>
              </div>
            </section>

          </div>

          <!-- RIGHT: Ticket Sidebar -->
          <div class="lg:col-span-1">
            <div class="sticky top-24 bg-zinc-900 border border-zinc-800 rounded-2xl p-6 space-y-6">

              <!-- Date Selection -->
              <div>
                <p class="text-xs text-zinc-400 uppercase tracking-wide font-medium mb-3">Select Date & Time</p>
                <div class="space-y-2">
                  ${e.dates.map((d, i) => `
                    <button class="date-btn w-full border border-zinc-700 rounded-xl px-4 py-3 text-left flex justify-between items-center ${i === 0 ? 'selected' : 'hover:border-zinc-500'}"
                      onclick="selectDate(${i})">
                      <span class="text-sm font-medium text-white">${d.label}</span>
                      <span class="text-xs text-zinc-400">${d.time}</span>
                    </button>
                  `).join('')}
                </div>
              </div>

              <!-- Tier Selection -->
              <div>
                <p class="text-xs text-zinc-400 uppercase tracking-wide font-medium mb-3">Ticket Tier</p>
                <div class="space-y-2">
                  ${e.tiers.map((t, i) => `
                    <div class="tier-card border border-zinc-700 rounded-xl p-4 cursor-pointer ${i === 0 ? 'selected' : ''}" onclick="selectTier(${i})">
                      <div class="flex justify-between items-start">
                        <div>
                          <p class="text-white text-sm font-medium">${t.name}</p>
                          <p class="text-xs text-zinc-500 mt-0.5">${t.available.toLocaleString()} available</p>
                        </div>
                        <span class="text-violet-400 font-bold text-sm">₱${t.price.toLocaleString()}</span>
                      </div>
                      <!-- Availability Bar -->
                      <div class="mt-3 h-1 bg-zinc-700 rounded-full overflow-hidden">
                        <div class="h-full bg-violet-500 rounded-full" style="width: ${Math.min(100, 100 - (t.available / (t.available * 1.5)) * 100 + 40)}%"></div>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- Quantity -->
              <div>
                <p class="text-xs text-zinc-400 uppercase tracking-wide font-medium mb-3">Quantity</p>
                <div class="flex items-center gap-4">
                  <button onclick="changeQty(-1)" class="w-9 h-9 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-white flex items-center justify-center font-bold">−</button>
                  <span id="qtyDisplay" class="text-white font-bold text-lg w-6 text-center">1</span>
                  <button onclick="changeQty(1)" class="w-9 h-9 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-white flex items-center justify-center font-bold">+</button>
                  <span class="text-zinc-500 text-xs ml-auto">Max 10 per order</span>
                </div>
              </div>

              <!-- Total -->
              <div class="border-t border-zinc-800 pt-4">
                <div class="flex justify-between items-center mb-4">
                  <span class="text-zinc-400 text-sm">Total</span>
                  <span id="totalPrice" class="text-white font-bold text-xl">₱${e.tiers[0].price.toLocaleString()}</span>
                </div>
                <button onclick="openModal()" class="w-full bg-violet-600 hover:bg-violet-500 text-white py-3 rounded-xl font-semibold text-sm transition-colors">
                  <i class="fa-solid fa-ticket mr-2"></i>Buy Tickets
                </button>
                <p class="text-center text-zinc-600 text-xs mt-3">Secure checkout · No hidden fees</p>
              </div>

            </div>
          </div>

        </div>
      `;
    }

    // ─── Interactions ─────────────────────────────────────────────────────────────
    function switchImage(i) {
      state.activeImg = i;
      document.getElementById('mainImg').src = state.event.images[i];
      document.querySelectorAll('.thumb').forEach((el, idx) => {
        el.classList.toggle('active', idx === i);
        el.style.opacity = idx === i ? '1' : '0.5';
      });
    }

    function selectDate(i) {
      state.selectedDate = i;
      document.querySelectorAll('.date-btn').forEach((b, idx) => {
        b.classList.toggle('selected', idx === i);
        if (idx !== i) b.classList.remove('selected');
      });
    }

    function selectTier(i) {
      state.selectedTier = i;
      document.querySelectorAll('.tier-card').forEach((c, idx) => c.classList.toggle('selected', idx === i));
      updateTotal();
    }

    function changeQty(delta) {
      state.qty = Math.max(1, Math.min(10, state.qty + delta));
      document.getElementById('qtyDisplay').textContent = state.qty;
      updateTotal();
    }

    function updateTotal() {
      const tier = state.event.tiers[state.selectedTier];
      const total = tier.price * state.qty;
      document.getElementById('totalPrice').textContent = `₱${total.toLocaleString()}`;
    }

    function openModal() {
      const e = state.event;
      const tier = e.tiers[state.selectedTier];
      const date = e.dates[state.selectedDate];
      const total = tier.price * state.qty;

      document.getElementById('modalSummary').innerHTML = `
        <div class="flex justify-between text-zinc-300"><span>Event</span><span class="font-medium text-white text-right ml-4">${e.title}</span></div>
        <div class="flex justify-between text-zinc-300"><span>Date</span><span class="text-white">${date.label} · ${date.time}</span></div>
        <div class="flex justify-between text-zinc-300"><span>Tier</span><span class="text-white">${tier.name}</span></div>
        <div class="flex justify-between text-zinc-300"><span>Quantity</span><span class="text-white">${state.qty} ticket${state.qty > 1 ? 's' : ''}</span></div>
        <div class="border-t border-zinc-700 pt-2 flex justify-between font-semibold"><span class="text-zinc-300">Total</span><span class="text-violet-400 text-base">₱${total.toLocaleString()}</span></div>
      `;
      document.getElementById('buyModal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('buyModal').classList.remove('open');
    }

    function selectPayment(btn) {
      document.querySelectorAll('.pay-btn').forEach(b => {
        b.classList.remove('border-violet-500', 'text-white', 'bg-violet-950');
        b.classList.add('border-zinc-700', 'text-zinc-400');
      });
      btn.classList.add('border-violet-500', 'text-white', 'bg-violet-950');
      btn.classList.remove('border-zinc-700', 'text-zinc-400');
    }

  function submitOrder() {
    const e = state.event;
    const tier = e.tiers[state.selectedTier];
    const date = e.dates[state.selectedDate];
    const total = tier.price * state.qty;

    // Pass order data via URL parameters
    const params = new URLSearchParams({
      eventId: e.id,
      eventTitle: e.title,
      date: date.label + " • " + date.time,
      tier: tier.name,
      quantity: state.qty,
      total: total,
      location: e.location
    });

    window.location.href = `order-summary.html?${params.toString()}`;
  }

    // Close modal on backdrop click
    document.getElementById('buyModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    init();
  </script>
</body>
</html>
