<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Absolute Cinema Tickets</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-zinc-950 text-zinc-300">
    <!-- Nav -->
    <nav
      class="border-b border-zinc-800 sticky top-0 z-50 bg-zinc-950/90 backdrop-blur"
    >
      <div
        class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between"
      >
        <div class="flex items-center gap-2 text-white">
          <i class="fa-solid fa-ticket text-violet-400 text-xl"></i>
          <span class="text-lg font-semibold tracking-tight"
            >Absolute Cinema</span
          >
        </div>
        <div class="hidden md:flex items-center gap-6 text-sm text-zinc-400">
          <a href="profile.html" class="hover:text-white">My Profile </a>
        </div>
        <div class="flex items-center gap-3">
          <button
            class="text-sm text-zinc-400 hover:text-white px-3 py-1.5"
            onclick="window.location.href='login.html'"
          >
            Login
          </button>
          <button
            class="text-sm bg-violet-600 hover:bg-violet-500 text-white px-4 py-1.5 rounded-lg"
            onclick="window.location.href='signup.html'"
          >
            Sign Up
          </button>
        </div>
      </div>
    </nav>

    <!-- Hero -->
    <header
      class="py-20 px-6 text-center"
      style="
        background: radial-gradient(
          ellipse at 50% 0%,
          rgba(124, 58, 237, 0.15) 0%,
          transparent 70%
        );
      "
    >
      <p
        class="text-violet-400 text-sm font-medium mb-3 tracking-widest uppercase"
      >
        Live Events
      </p>
      <h2 class="text-5xl text-white mb-4">
        Find Your Next<br />Live Experience
      </h2>
      <p class="text-zinc-400 mb-8 max-w-md mx-auto">
        Concerts, sports, theatre — all in one place.
      </p>
      <div class="max-w-lg mx-auto flex gap-2">
        <input
          id="searchInput"
          type="text"
          placeholder="Search events or artists..."
          class="flex-1 bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-violet-500"
        />
        <button
          onclick="performSearch()"
          class="bg-violet-600 hover:bg-violet-500 text-white px-5 py-3 rounded-xl text-sm font-medium"
        >
          Search
        </button>
      </div>
    </header>

    <!-- Filters -->
    <div class="max-w-6xl mx-auto px-6 pb-6 flex flex-wrap items-center gap-3">
      <button
        onclick="setFilter('all')"
        data-cat="all"
        class="filter-btn active text-sm px-4 py-2 rounded-lg bg-violet-600 text-white"
      >
        All
      </button>
      <button
        onclick="setFilter('concert')"
        data-cat="concert"
        class="filter-btn text-sm px-4 py-2 rounded-lg bg-zinc-800 text-zinc-300 hover:bg-zinc-700"
      >
        Concerts
      </button>
      <button
        onclick="setFilter('sports')"
        data-cat="sports"
        class="filter-btn text-sm px-4 py-2 rounded-lg bg-zinc-800 text-zinc-300 hover:bg-zinc-700"
      >
        Sports
      </button>
      <button
        onclick="setFilter('theatre')"
        data-cat="theatre"
        class="filter-btn text-sm px-4 py-2 rounded-lg bg-zinc-800 text-zinc-300 hover:bg-zinc-700"
      >
        Theatre
      </button>
      <button
        onclick="setFilter('festival')"
        data-cat="festival"
        class="filter-btn text-sm px-4 py-2 rounded-lg bg-zinc-800 text-zinc-300 hover:bg-zinc-700"
      >
        Festivals
      </button>
      <button
        onclick="resetFilters()"
        class="ml-auto text-xs text-zinc-500 hover:text-white flex items-center gap-1.5"
      >
        <i class="fa-solid fa-rotate"></i> Reset
      </button>
    </div>

    <!-- Grid -->
    <main class="max-w-6xl mx-auto px-6 pb-20">
      <div
        id="eventsGrid"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"
      ></div>
      <p id="emptyMsg" class="hidden text-center text-zinc-500 py-16 text-sm">
        No events found.
      </p>
    </main>

    <!-- Footer -->
    <footer
      class="border-t border-zinc-800 py-8 text-center text-zinc-600 text-sm"
    >
      <div class="flex justify-center items-center gap-2 text-zinc-400 mb-3">
        <i class="fa-solid fa-ticket text-violet-400"></i>
        <span class="font-medium">Absolute Cinema</span>
      </div>
      <div class="flex justify-center gap-6 text-xs mb-4">
        <a href="faqs.html" class="hover:text-zinc-300">FAQs</a>
        <a
          href="https://www.facebook.com/jersey1705"
          target="_blank"
          class="hover:text-zinc-300"
          >Contact</a
        >
        <a href="terms.html" class="hover:text-zinc-300">Terms</a>
      </div>
      <p>© 2026 Absolute Cinema. All rights reserved.</p>
    </footer>

    <!-- LOGIN PROMPT MODAL -->
    <div
      id="loginPromptModal"
      class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4"
    >
      <div
        class="bg-zinc-900 border border-zinc-700 rounded-2xl w-full max-w-sm p-6 relative text-center"
      >
        <button
          onclick="closeLoginPrompt()"
          class="absolute top-4 right-4 text-zinc-500 hover:text-white"
        >
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
        <i class="fa-solid fa-lock text-violet-400 text-4xl mb-4 block"></i>
        <h3 class="text-xl text-white font-semibold mb-2">Sign In Required</h3>
        <p class="text-zinc-400 text-sm mb-6">
          You need to be logged in to purchase tickets.
        </p>
        <div class="flex flex-col gap-3">
          <button
            onclick="window.location.href='login.html'"
            class="w-full bg-violet-600 hover:bg-violet-500 text-white py-3 rounded-xl font-medium text-sm"
          >
            Sign In
          </button>
          <button
            onclick="window.location.href='signup.html'"
            class="w-full bg-zinc-800 hover:bg-zinc-700 text-white py-3 rounded-xl font-medium text-sm"
          >
            Create Account
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
